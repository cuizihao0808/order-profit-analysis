name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 覆盖率任务会跑全部测试，不再单独跑一遍 npm test
      - run: npm run test:coverage
      - run: npm run build